  # glibc 2.38, in case a notebook runs them
  os: "ubuntu-24.04"
  tools:
    python: "mambaforge-22.9"

conda:
  environment: conda/environment.yml

sphinx:
  # Path to your Sphinx configuration file.
  configuration: doc/conf.py